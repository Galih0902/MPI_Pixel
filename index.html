const UP=['https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js'],UQ=['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js','https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'];
function loadJS(list,test){return new Promise((res,rej)=>{if(test())return res();let i=0;const nx=()=>{if(i>=list.length)return rej();const s=document.createElement('script');s.src=list[i++];s.onload=()=>res();s.onerror=nx;document.head.appendChild(s)};nx()})}

Sisa makanan termasuk sampah...|Anorganik|Organik|Logam|Plastik|B|Misi Lingkungan
Menanam kembali hutan yang gundul disebut...|Reboisasi|Erosi|Polusi|Urbanisasi|A|Misi Lingkungan
Cara mengurangi sampah plastik adalah...|Dibakar|Dibuang ke sungai|Membawa tas belanja sendiri|Dikubur sembarangan|C|Misi Lingkungan`;
const EX='Pertanyaan|A|B|C|D|Jawaban|Misi|Tipe|Level\n2+3=?|4|5|6|7|B|Misi Matematika|mcq|1\nMatahari terbit dari timur|Benar|Salah|||A|Misi Sains|tf|1\nIbu kota Indonesia saat ini adalah...|Jakarta/DKI Jakarta||||A|Misi IPS|isi|2';
function csvSplit(l,d){if(!l.includes('"'))return l.split(d).map(x=>x.trim());const o=[];let c='',q=0;for(let i=0;i<l.length;i++){const h=l[i];if(h=='"'){if(q&&l[i+1]=='"'){c+='"';i++}else q=!q}else if(h==d&&!q){o.push(c.trim());c=''}else c+=h}o.push(c.trim());return o}
function parse(t,dm){const items=[],bad=[];t.split(/\r?\n/).forEach((l,n)=>{if(!l.trim())return;const d=l.includes('|')?'|':l.includes('\t')?'\t':l.includes(';')?';':',',f=csvSplit(l,d);if(/^(pertanyaan|soal)$/i.test(f[0]))return;const tp=(f[7]||'').toLowerCase(),ty=/^(isi|isian|esai|short)/.test(tp)?2:/^(tf|bs|benar|b\/s|bool)/.test(tp)?1:0,lv=Math.min(3,Math.max(0,parseInt(f[8])||0));let o,a;
if(ty==2){const v=(f[1]||'').split('/').map(x=>x.trim()).filter(Boolean);if(!f[0]||!v.length){bad.push(n+1);return}items.push({q:f[0],o:v,a:0,m:f[6]||dm||'Umum',ty,lv});return}
const ak=(f[5]||'').toUpperCase();if(ty==1){o=[f[1]||'Benar',f[2]||'Salah'];a={BENAR:0,TRUE:0,A:0,'1':0,SALAH:1,FALSE:1,B:1,'2':1}[ak];if(a===undefined||!f[0]){bad.push(n+1);return}}
else{a=ak.length==1&&'ABCD'.includes(ak)?'ABCD'.indexOf(ak):(+ak>=1&&+ak<=4?+ak-1:-1);o=f.slice(1,5);if(!f[0]||o.length<4||o.some(x=>!x)||a<0){bad.push(n+1);return}}
items.push({q:f[0],o,a,m:f[6]||dm||'Umum',ty,lv})});return{items,bad}}
let bank=[],set={pt:10,bn:50,mp:25,cp:10,tm:'off',td:15,url:'',tn:0};
try{bank=JSON.parse(store.get('pa_bank'))}catch(e){}if(!Array.isArray(bank)||!bank.length)bank=parse(DEF).items;
try{set=Object.assign(set,JSON.parse(store.get('pa_set')))}catch(e){}
const persist=()=>store.set('pa_bank',JSON.stringify(bank)),sv=()=>store.set('pa_set',JSON.stringify(set));

<p class=sm>${bank.length} soal • ${Object.keys(groups()).length} misi</p></div>`}

function refRows(){$('rows').innerHTML=vRows()}
function setTab(k){if(k!='form')editI=-1;tab=k;draw()}
function tgSel(i,c){c?sel.add(i):sel.delete(i);refRows()}
function selAll(){const v=vis(),all=v.every(i=>sel.has(i));v.forEach(i=>all?sel.delete(i):sel.add(i));refRows()}
function delSel(){if(!sel.size)return toast('Belum ada soal dipilih');const n=sel.size;bank=bank.filter((s,i)=>!sel.has(i));sel.clear();persist();toast(n+' soal dihapus');draw()}
function delQ(i){bank.splice(i,1);sel.clear();persist();draw()}
function edit(i){editI=i;tab='form';draw()}
function saveQ(){const ty=+$('fty').value,q=$('fq').value.trim(),m=$('fmis').value.trim()||'Umum',lv=+$('flv').value;let o=[0,1,2,3].map(j=>$('fo'+j).value.trim()),a=+$('fk').value;
if(!q)return toast('Isi pertanyaan');
if(ty==2){const v=o[0].split('/').map(x=>x.trim()).filter(Boolean);if(!v.length)return toast('Isi jawaban di kolom A (variasi dipisah /)');o=v;a=0}
else if(ty==1){if(!o[0])o[0]='Benar';if(!o[1])o[1]='Salah';o=o.slice(0,2);if(a>1)return toast('Benar/Salah: kunci harus A atau B')}
else if(o.some(x=>!x))return toast('Isi semua pilihan A-D');
const s={q,o,a,m,ty,lv};editI>=0?bank[editI]=s:bank.push(s);persist();toast('Soal tersimpan ✔');editI=-1;tab='list';draw()}
function updInfo(){const r=parse($('im').value,$('dm').value.trim()||'Umum');$('iv').innerHTML=`✔ ${r.items.length} soal valid`+(r.bad.length?` • ✖ baris salah: ${r.bad.slice(0,12).join(', ')}`:'')}
function impor(rep){const r=parse($('im').value,$('dm').value.trim()||'Umum');if(!r.items.length)return toast('Tidak ada soal valid. Cek format lewat TEMPLATE');bank=rep?r.items:bank.concat(r.items);sel.clear();persist();toast(r.items.length+' soal diimpor ✔');tab='list';draw()}
function expo(){$('im').value='Pertanyaan|A|B|C|D|Jawaban|Misi|Tipe|Level\n'+bank.map(s=>{const ty=s.ty|0,o=ty==2?[s.o.join('/'),'','','']:[...s.o,'',''].slice(0,4);return [s.q,...o,ty==2?'A':'ABCD'[s.a],s.m,['mcq','tf','isi'][ty],s.lv||''].map(x=>String(x).replace(/\|/g,'/')).join('|')}).join('\n');updInfo()}
function cp(){const v=$('im').value;if(!v)return toast('Kotak teks kosong');try{navigator.clipboard.writeText(v).then(()=>toast('Tersalin ✔'),()=>{$('im').select();toast('Blok teks lalu salin manual')})}catch(e){$('im').select();toast('Blok teks lalu salin manual')}}
function loadFile(el){const f=el.files[0];if(!f)return;if(/\.xlsx?$/i.test(f.name)){toast('Membaca file Excel…');loadJS(['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'],()=>window.XLSX).then(()=>{const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});$('im').value=rows.map(r=>r.map(x=>String(x).replace(/\|/g,'/').replace(/[\r\n]+/g,' ')).join('|')).join('\n');updInfo()}catch(e){toast('File Excel tidak bisa dibaca')}};r.readAsArrayBuffer(f)}).catch(()=>toast('Gagal memuat pustaka Excel (butuh internet)'));return}const r=new FileReader();r.onload=()=>{$('im').value=r.result;updInfo()};r.readAsText(f)}

/* ===== RUANGAN (GURU = HOST, PeerJS) ===== */
const LE=['🏰','⛺','🌋','🛖','⛲','🗻','🏝️','🛕','🎪','🏯','🗼','🎡','🏛️','🚀','🛸','🕌'];
const hSend=(p,m)=>{try{if(p&&m&&(m.t=='q'||m.t=='bq'||m.t=='cq'))p.qt=Date.now();p&&p.conn&&p.conn.open&&p.conn.send(m)}catch(e){}};
const TN=['Merah','Biru','Hijau','Kuning'],TCOL=['#e04a4a','#41a6f6','#38b764','#ffcd75'],MSC=[1,1.5,2,4];
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const cnts=p=>[p.nc,p.nk,Object.keys(p.dn).length,p.bs,p.it],mult=()=>OH&&OH.dbl>Date.now()?2:1,spd=p=>{const t=(Date.now()-(p.qt||0))/1000;return t<4?5:t<8?3:t<15?1:0};
const teamSc=()=>OH&&OH.tn?Array.from({length:OH.tn},(_,i)=>OH.pl.filter(p=>p.tmi==i).reduce((a,p)=>a+p.sc,0)):null;
function mkQ(s){const ty=s.ty|0;if(ty==2)return{ty,src:s,v:s.o.map(norm),at:s.o[0],q:s.q,o:[],a:0};if(ty==1)return{ty,src:s,a:s.a,q:s.q,o:[...s.o]};const ix=shuf([0,1,2,3]);return{ty,src:s,a:ix.indexOf(s.a),q:s.q,o:ix.map(j=>s.o[j])}}
const okQ=(qo,m)=>qo.ty==2?qo.v.includes(norm(m.x)):m.k==qo.a,validQ=(qo,m)=>qo.ty==2?typeof m.x=='string'&&m.x.length<120:Number.isInteger(m.k)&&m.k>=0&&m.k<qo.o.length,qMsg=qo=>({qt:qo.ty,q:qo.q,o:qo.o}),rvx=(qo,m)=>qo.ty==2?{at:qo.at,sx:String(m.x||'').slice(0,60)}:{};
function stat(qo,ok){const H=OH,k=qo.src.q,r=H.qs[k]||(H.qs[k]={q:k,m:qo.src.m,n:0,w:0});r.n++;if(!ok)r.w++}
function streakUp(p){const st=++p.st;if(st>p.bs)p.bs=st;p.ok++;return st}
function award(p,base,sp){const st=streakUp(p),cb=Math.min(st-1,5)*2,s2=sp?spd(p):0,g=Math.round((base+cb+s2)*mult());p.sc+=g;return{gain:g,cb,sp:s2,st,x2:mult()>1?1:0}}
const miss=p=>{p.st=0;p.ng++};
const baseUrl=()=>/^https?:/.test(location.protocol)?location.origin+location.pathname:(set.url||'');
const joinUrl=()=>{const b=baseUrl();return b&&OH&&OH.code?b+'?join='+OH.code:''};
const QC={};function qrSvg(t){if(QC[t])return QC[t];try{if(!window.qrcode)return '';const q=qrcode(0,'M');q.addData(t);q.make();return QC[t]=q.createSvgTag(5,2)}catch(e){return ''}}
function rdraw(){if(rdraw.t)return;rdraw.t=setTimeout(()=>{rdraw.t=0;if(view!=='room')return;const a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))rdraw();else{const y=window.scrollY;draw();window.scrollTo(0,y)}},400)}
function roomOpen(){if(!OH){OH={code:'',peer:null,ok:false,err:'',pl:[],ph:'lobby',ms:[],pt:10,bn:50};hostInit();OH.bt=setInterval(bcast,200)}view='room';draw()}
function roomNew(){if(OH){clearInterval(OH.bt);try{OH.peer&&OH.peer.destroy()}catch(e){}OH=null}roomOpen()}
function hostInit(){const H=OH;loadJS(UP,()=>window.Peer).then(()=>{if(OH!==H)return;H.code=genCode();const pe=new Peer('pa-'+H.code);H.peer=pe;
pe.on('open',()=>{H.ok=true;H.err='';rdraw()});pe.on('connection',c=>{c.on('data',m=>hMsg(c,m));const dr=()=>{if(c._p&&c._p.conn===c){c._p.on=false;rdraw()}};c.on('close',dr);c.on('error',dr)});
pe.on('disconnected',()=>{try{pe.reconnect()}catch(e){}});
pe.on('error',e=>{if(e.type=='unavailable-id'){try{pe.destroy()}catch(x){}hostInit()}else{H.err='Koneksi ke server perantara bermasalah ('+e.type+')';rdraw()}})}).catch(()=>{H.err='PeerJS gagal dimuat, butuh koneksi internet';rdraw()})}
function hSync(p){const H=OH;if(H.ph=='lobby')hSend(p,{t:'lobby'});else if(H.ph=='play'){hSend(p,{t:'start',ms:H.ms.map(x=>({name:x.name,e:x.e,n:x.qs.length})),sc:p.sc,dn:p.dn,tm:H.tm,td:H.td,el:(H.paused?H.pt0:Date.now())-H.t0,tn:H.tn||0,ti:p.tmi});hSend(p,pgMsg(p));if(H.paused)hSend(p,{t:'pa',on:1,el:H.pt0-H.t0});if(p.cur)hSend(p,p.cur.msg);if(p.bt&&p.bt.msg)hSend(p,p.bt.msg);if(p.cq)hSend(p,p.cq.msg)}else hEnd(p)}
function hEnd(p){const H=OH,r=[...H.pl].sort((a,b)=>b.sc-a.sc);hSend(p,{t:'end',rank:r.map(x=>[x.n,x.sc,Object.keys(x.dn).length,x.tmi,x.bs]),me:r.indexOf(p),tot:H.ms.length,tb:teamSc(),tn:H.tn||0})}
function pgMsg(p){const H=OH;return{t:'pg',nc:p.nc,nk:p.nk,wp:p.wp,qc:p.qc,mk:p.mk,ch:p.ch,sc:p.sc,gl:[2,3,Math.min(3,Math.max(1,H.ms.length)),5,3],hn:p.hn,sh:p.sh,it:p.it,st:p.st,bs:p.bs,bo:H.boss?{hp:H.boss.hp,mx:H.boss.mx}:0}}
function rq(p,lv){if(!p.bu||p.bu.length>=bank.length)p.bu=[];let pool=[];for(let i=0;i<bank.length;i++)if(!p.bu.includes(i)&&(!lv||!bank[i].lv||bank[i].lv==lv))pool.push(i);if(!pool.length)for(let i=0;i<bank.length;i++)if(!p.bu.includes(i))pool.push(i);if(!pool.length){p.bu=[];pool=bank.map((s,i)=>i)}const i=pool[Math.random()*pool.length|0];p.bu.push(i);return mkQ(bank[i])}
function hBq(p){const b=p.bt,r=rq(p,b.boss?3:b.ty+1);if(b.boss&&OH.boss){b.hp=OH.boss.hp;b.mx=OH.boss.mx}b.qo=r;b.msg={t:'bq',id:b.id,ty:b.ty,hp:b.hp,mx:b.mx,he:b.he,wp:p.wp,boss:b.boss?1:0,...qMsg(r)};hSend(p,b.msg)}
function bossDown(p){const H=OH,g=Math.round(H.mp*2*mult());H.pl.forEach(q=>{if(q!==p)q.sc+=g;hSend(q,{t:'ev',k:'bossdead',txt:'🏆 BOSS KALAH oleh '+p.n+'! Semua dapat +'+g+' ⭐'})});H.boss=null;H.pl.forEach(q=>hSend(q,pgMsg(q)))}
function hMsg(c,m){const H=OH;if(!H||!m||typeof m!='object')return;if(H.paused&&['ask','bs','bo','cs','ans','ba','ca','claim','bn','use'].includes(m.t))return;
if(m.t=='join'){let p=m.tok&&H.pl.find(x=>x.tok===m.tok);if(p){p.conn=c;p.on=true}else{let nm=String(m.name||'').trim().slice(0,14)||'Siswa',b=nm,n=2;while(H.pl.some(x=>x.n===nm))nm=b+' '+n++;const tn=H.ph=='play'?(H.tn||0):(+set.tn||0);p={n:nm,tok:rnd(),conn:c,on:true,sc:0,pr:{},dn:{},ord:{},cur:null,nc:0,nk:0,wp:0,qc:{},mk:{},ch:{},bt:null,cq:null,bu:[],st:0,bs:0,ok:0,ng:0,hn:1,sh:0,it:0,sk:Array.isArray(m.sk)?[Math.max(0,Math.min(5,m.sk[0]|0)),Math.max(0,Math.min(7,m.sk[1]|0))]:[0,0],tmi:tn?H.pl.length%tn:-1,em:0,emt:0,qt:0};H.pl.push(p)}c._p=p;hSend(p,{t:'joined',n:p.n,tok:p.tok});hSync(p);rdraw()}
else if(m.t=='ask'){const p=c._p;if(!p||H.ph!='play')return;if(p.cur)return hSend(p,p.cur.msg);const mi=m.m,mq=H.ms[mi];if(!mq||p.dn[mi])return;const od=p.ord[mi]||(p.ord[mi]=shuf([...mq.qs.keys()])),k=p.pr[mi]||0,qo=mkQ(mq.qs[od[k]]);p.cur={m:mi,qo,msg:{t:'q',m:mi,k,n:mq.qs.length,...qMsg(qo)}};hSend(p,p.cur.msg)}
else if(m.t=='cx'){const p=c._p;if(!p)return;p.cur=null;p.bt=null;p.cq=null;hSend(p,pgMsg(p))}
else if(m.t=='bye'){const p=c._p;if(p){p.on=false;p.cur=null;p.bt=null;p.cq=null}rdraw()}
else if(m.t=='bs'){const p=c._p;if(!p||H.ph!='play'||p.cq||!bank.length)return;const id=+m.m;if(!(id>=0&&id<MP.length)||p.mk[id])return;if(p.bt&&p.bt.id==id)return hBq(p);const ty=id%3;p.bt={id,ty,hp:MH[ty],mx:MH[ty],he:3};hBq(p)}
else if(m.t=='bo'){const p=c._p;if(!p||H.ph!='play'||p.cq||!bank.length||!H.boss||H.boss.hp<=0)return;if(p.bt&&p.bt.boss)return hBq(p);p.bt={id:-1,ty:3,boss:1,hp:H.boss.hp,mx:H.boss.mx,he:3};hBq(p)}
else if(m.t=='bn'){const p=c._p;if(!p||!p.bt)return;if(p.bt.boss&&!H.boss){const b=p.bt;p.bt=null;hSend(p,{t:'br',ok:true,a:b.qo?b.qo.a:0,sel:b.qo?b.qo.a:0,dmg:0,hp:0,mx:b.mx,he:b.he,end:1,gain:0,st:p.st,sc:p.sc});return hSend(p,pgMsg(p))}hBq(p)}
else if(m.t=='ba'){const p=c._p;if(!p||!p.bt||!p.bt.qo||!validQ(p.bt.qo,m))return;const b=p.bt,qo=b.qo,ok=okQ(qo,m);stat(qo,ok);let end=0,sh=0,dmg=0,a={gain:0,cb:0,sp:0,x2:0};
if(ok){dmg=WD[p.wp]+(b.boss?1:0);if(b.boss&&H.boss){H.boss.hp-=dmg;b.hp=H.boss.hp}else b.hp-=dmg;if(b.hp<=0){end=1;a=award(p,Math.round(H.mp*MSC[b.ty]),1);if(b.boss){bossDown(p)}else{p.mk[b.id]=1;p.nk++}}else streakUp(p)}
else{miss(p);if(p.sh>0){p.sh--;sh=1}else{b.he--;if(b.he<=0)end=2}}
hSend(p,{t:'br',ok,a:qo.a,sel:m.k,...rvx(qo,m),dmg,hp:Math.max(0,b.hp),mx:b.mx,he:b.he,end,gain:a.gain,cb:a.cb,sp:a.sp,x2:a.x2||0,sh,st:p.st,sc:p.sc});b.msg=null;if(end)p.bt=null;hSend(p,pgMsg(p));rdraw()}
else if(m.t=='cs'){const p=c._p;if(!p||H.ph!='play'||p.bt||!bank.length)return;const id=+m.c;if(!(id>=0&&id<CH.length)||p.ch[id])return;if(p.cq&&p.cq.id==id)return hSend(p,p.cq.msg);const r=rq(p,0);p.cq={id,qo:r,msg:{t:'cq',c:id,...qMsg(r)}};hSend(p,p.cq.msg)}
else if(m.t=='ca'){const p=c._p;if(!p||!p.cq||!validQ(p.cq.qo,m))return;const qo=p.cq.qo,id=p.cq.id,ok=okQ(qo,m),tier=CT[id];stat(qo,ok);let a={gain:0,cb:0,sp:0,x2:0},nw=0,item=0;if(ok){p.ch[id]=1;p.nc++;a=award(p,H.cp,1);if(tier>p.wp){p.wp=tier;nw=1}item=Math.random()<.5?1:2;if(item==1)p.hn++;else p.sh++;p.it++}else miss(p);
hSend(p,{t:'cr',ok,a:qo.a,sel:m.k,...rvx(qo,m),tier,nw,item,gain:a.gain,cb:a.cb,sp:a.sp,x2:a.x2||0,st:p.st,sc:p.sc});p.cq=null;hSend(p,pgMsg(p));rdraw()}
else if(m.t=='use'){const p=c._p;if(!p||m.k!='h'||p.hn<1)return;const q=p.cur||p.bt||p.cq,qo=q&&q.qo;if(!qo||qo.ty!=0||qo.hx)return;const w=shuf([0,1,2,3].filter(j=>j!=qo.a)).slice(0,2);qo.hx=w;p.hn--;hSend(p,{t:'hint',x:w,hn:p.hn})}
else if(m.t=='claim'){const p=c._p,i=+m.n,q=QS[i];if(!p||!q||p.qc[i])return;const g=pgMsg(p).gl[i];if(cnts(p)[i]<g)return;p.qc[i]=1;p.sc+=q.b;hSend(p,pgMsg(p))}
else if(m.t=='pos'){const p=c._p;if(!p)return;const nx=+m.x,ny=+m.y;if(!Number.isFinite(nx)||!Number.isFinite(ny))return;p.x=Math.max(0,Math.min(WW*T,nx));p.y=Math.max(0,Math.min(WH*T,ny));p.d=['u','d','l','r'].includes(m.d)?m.d:'d';p.mv=m.m?1:0;p.q=m.q?1:0;p.ts=Date.now()}
else if(m.t=='sk'){const p=c._p;if(p)p.sk=[Math.max(0,Math.min(5,+m.s|0)),Math.max(0,Math.min(7,+m.h|0))]}

else if(C.st=='left')h=w(`<div class=hero>👋</div><p>Kamu keluar dari petualangan.<br>⭐ Skormu: ${C.sc}</p><button class="btn g" onclick="sConn()">🔁 MASUK LAGI</button>`);
else if(C.st=='npc'){const i=C.npc,q=QS[i],cu=ccnt()[i],g=C.pg.gl[i],dn=C.pg.qc[i],ok=cu>=g;h=w(`<div class=hero>${['🧑‍🌾','💂','👩‍🏫','🧑‍✈️','👵'][i]}</div><b>${q.n}</b><div class=qb style="max-width:520px">${q.d}</div><p style="color:var(--y)">📜 ${q.t}: ${Math.min(cu,g)}/${g} ${q.u}<br>Hadiah: ⭐ ${q.b}</p>${dn?'<p>✅ Tugas selesai!</p>':ok?`<button class="btn g" onclick="sClaim(${i})">🎁 AMBIL HADIAH</button>`:''}<button class="btn" onclick="sBack()">${dn||ok?'TUTUP':'👍 SIAP, AKU BERANGKAT!'}</button>`,'dim')}
else if(C.st=='bq'){const b=C.bq;h=w(`${XB}<div style="display:flex;gap:14px;align-items:center"><img src="${monImg(b.ty)}" style="width:84px;image-rendering:pixelated"><div style="text-align:left"><div class=sm>${MN[b.ty].toUpperCase()}</div><div class=bar><i style="width:${b.hp/b.mx*100}%"></i></div><div>${'❤️'.repeat(b.he)+'🖤'.repeat(3-b.he)}</div><div class=sm>${WI[b.wp]} ${WN[b.wp]} (-${WD[b.wp]})</div></div></div><div class=qb style="width:100%;max-width:560px">${esc(b.q)}</div>${qa(b,'sBA')}`,'dim')}
else if(C.st=='br'){const r=C.br,b=C.bq;h=w(`<div class=hero>${r.end==1?'🏆':r.end==2?'💀':r.ok?'⚔️':'💥'}</div><b style="color:${r.end==1||(r.ok&&!r.end)?'#7be08f':'#f99'}">${r.end==1?'MONSTER KALAH! +'+r.gain+' ⭐':r.end==2?'KAMU KALAH! Kembali ke desa':r.ok?'SERANGAN KENA! -'+r.dmg:'SALAH! Monster menyerang balik'}</b>${cbH(r)}${r.sh?'<div class=sm style="color:#73eff7">🛡️ PERISAI melindungimu! Hati tidak berkurang</div>':''}${rvh(b,r)}<p>👹 HP ${r.hp}/${r.mx} • ${'❤️'.repeat(r.he)}</p><button class="btn g" onclick="sBN()">${r.end?'LANJUT':'▶ SERANG LAGI'}</button>${r.end?'':'<button class="btn" onclick="sCancel()">🚪 MUNDUR</button>'}`,'dim')}
else if(C.st=='cq'){const b=C.cq;h=w(`${XB}<div class=hero>📦</div><div class=sm>PETI SENJATA • jawab dengan benar untuk membuka</div><div class=qb style="width:100%;max-width:560px">${esc(b.q)}</div>${qa(b,'sCA')}`,'dim')}
else if(C.st=='cr'){const r=C.cr,b=C.cq;h=w(`<div class=hero>${r.ok?'🎁':'🔒'}</div><b style="color:${r.ok?'#7be08f':'#f99'}">${r.ok?'PETI TERBUKA! +'+r.gain+' ⭐':'JAWABAN SALAH, peti masih terkunci'}</b>${cbH(r)}${r.item?'<p style="color:var(--y)">'+(r.item==1?'💡 +1 Petunjuk 50:50':'🛡️ +1 Perisai')+'</p>':''}${r.ok?`<p style="color:var(--y)">${WI[r.tier]} ${WN[r.tier]}${r.nw?'<br>Senjata baru dipakai!':'<br>(senjatamu sudah lebih baik)'}</p>`:'<p class=sm>Jauhi lalu dekati lagi untuk mencoba soal lain.</p>'}${rvh(b,r)}<button class="btn g" onclick="sBack()">LANJUT</button>`,'dim')}
else if(C.st=='cos'){const lv=lvOf(C.sc);h=w(`<div class=logo style="font-size:14px">👕 KARAKTERKU</div><p class=sm>Level ${lv} • topi baru terbuka di level tertentu</p><b class=sm>BAJU${C.tn?' (mode tim: warna dikunci tim)':''}</b><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${SH.map((c,j)=>`<button onclick="sSk(${j},${C.sk[1]})" style="width:44px;height:44px;border:4px solid ${C.sk[0]==j?'#fff':'#000'};background:${c}"></button>`).join('')}</div><b class=sm>TOPI</b><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${HATS.map((c,j)=>{const ok=lv>=HL[j];return `<button ${ok?`onclick="sSk(${C.sk[0]},${j})"`:'disabled'} style="width:56px;height:56px;border:4px solid ${C.sk[1]==j?'#fff':'#000'};background:${ok?c:'#222'};color:#fff;font-size:8px">${ok?'':'🔒Lv'+HL[j]}</button>`}).join('')}</div><button class="btn g" onclick="sBack()">✔ SELESAI</button>`,'dim')}
else if(C.st=='end'){const e=C.end;h=w(`<div class=logo style="font-size:18px">🏆 PERINGKAT</div><p class=sm>Kamu peringkat #${e.me+1}</p>${e.tn&&e.tb?'<div class=qb style="width:100%;max-width:420px"><b style="color:var(--y)">🏁 TIM</b>'+e.tb.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v).map(({v,i})=>'<div class=lr><b style="color:'+TCOL[i]+'">■ '+TN[i]+'</b><b style="float:right">'+v+'</b></div>').join('')+'</div>':''}<div style="width:100%;max-width:420px;text-align:left">${e.rank.map((t,i)=>`<div class=row style="${i==e.me?'background:var(--y);color:#3a2a10':''}"><span>${['🥇','🥈','🥉'][i]||i+1+'.'}</span><div class=rq>${t[3]>=0?'<b style="color:'+TCOL[t[3]]+'">■</b> ':''}${esc(t[0])}<br><small style="color:inherit">🏅 ${t[2]}/${e.tot} misi • 🔥 ${t[4]|0}</small></div><b>${t[1]}</b></div>`).join('')}</div>`)}
if(C.paused)h+='<div class=scr style="background:rgba(10,12,30,.88);z-index:6"><div class=hero>⏸</div><p>Permainan dijeda oleh guru</p></div>';if(C.lost)h+='<div class=scr dim style="background:rgba(10,12,30,.9);z-index:5"><div class=hero>📡</div><p>Terputus… menyambung ulang</p></div>';
$('ui').innerHTML=h}
requestAnimationFrame(frame);if(JOIN)sInit();else draw();
</script></body></html>
